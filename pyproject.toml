[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdmap"
version = "0.1.0"
description = "Rambow differentiation maps: unsupervised tile clustering of H&E whole-slide images of in-transit melanoma metastases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "pillow>=9.1",
    "tqdm>=4.64",
    "openslide-python>=1.4",
    "openslide-bin>=4.0",
    "tifffile>=2025.5.21",
    "zarr>=3.0.8",
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0",
    "huggingface-hub>=0.20",
    "tokenizers>=0.15",
    "conch @ git+https://github.com/Mahmoodlab/CONCH.git@141cc09c7d4ff33d8eda562bd75169b457f71a62",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0"]

[project.scripts]
rdmap = "rdmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
